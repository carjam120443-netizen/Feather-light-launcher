name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Feather Light Launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set build version
        id: version
        shell: bash
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building Feather Light Launcher ${VERSION_NAME} (${VERSION_CODE})"

      - name: Decode persistent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.FEATHER_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "FEATHER_KEYSTORE_B64 secret is not configured"; exit 1; }

          CLEAN_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"

          if ! printf '%s' "$CLEAN_B64" | base64 --decode >/dev/null 2>&1; then
            echo "FEATHER_KEYSTORE_B64 is not valid Base64. It must contain the Base64-encoded contents of the persistent .jks/.keystore file." >&2
            exit 1
          fi

          printf '%s' "$CLEAN_B64" | base64 --decode > "$RUNNER_TEMP/feather-release.jks"
          test -s "$RUNNER_TEMP/feather-release.jks" || { echo "Decoded keystore is empty"; exit 1; }

      - name: Prepare Gradle signing keystore
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/feather-release.jks
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.FEATHER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FEATHER_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.FEATHER_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_ALIAS" || { echo "FEATHER_KEY_ALIAS secret is not configured"; exit 1; }

          SOURCE_STORE_PASSWORD="$KEYSTORE_PASSWORD_SECRET"
          SOURCE_KEY_PASSWORD="$KEY_PASSWORD_SECRET"
          if [ "$SOURCE_STORE_PASSWORD" = "BLANK" ]; then SOURCE_STORE_PASSWORD=""; fi
          if [ "$SOURCE_KEY_PASSWORD" = "BLANK" ]; then SOURCE_KEY_PASSWORD=""; fi

          # Android Gradle Plugin expects a usable signing password. For a
          # passwordless source keystore, re-wrap the same signing key into a
          # temporary password-protected keystore. The persistent key itself
          # never changes, so future releases remain update-compatible.
          NORMALIZED_PATH="$RUNNER_TEMP/feather-release-signing.jks"
          DEST_PASSWORD="$(openssl rand -hex 24)"

          keytool -importkeystore \
            -noprompt \
            -srckeystore "$KEYSTORE_PATH" \
            -srcstoretype JKS \
            -srcstorepass "$SOURCE_STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$SOURCE_KEY_PASSWORD" \
            -destkeystore "$NORMALIZED_PATH" \
            -deststoretype JKS \
            -deststorepass "$DEST_PASSWORD" \
            -destkeypass "$DEST_PASSWORD" \
            -destalias "$KEY_ALIAS"

          test -s "$NORMALIZED_PATH" || { echo "Failed to create normalized signing keystore"; exit 1; }

          echo "normalized_keystore_path=$NORMALIZED_PATH" >> "$GITHUB_OUTPUT"
          echo "normalized_keystore_password=$DEST_PASSWORD" >> "$GITHUB_OUTPUT"
        id: signing

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.normalized_keystore_path }}
          KEYSTORE_PASSWORD: ${{ steps.signing.outputs.normalized_keystore_password }}
          KEY_ALIAS: ${{ secrets.FEATHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.signing.outputs.normalized_keystore_password }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_ALIAS" || { echo "FEATHER_KEY_ALIAS secret is not configured"; exit 1; }

          gradle assembleRelease --no-daemon \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PkeystorePath="$KEYSTORE_PATH" \
            -PkeystorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/FeatherLightLauncher-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Light-Launcher-APK
          path: app/build/outputs/apk/release/FeatherLightLauncher-v${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version_name }}"
          name: "Feather Light Launcher v${{ steps.version.outputs.version_name }}"
          generate_release_notes: true
          prerelease: true
          files: app/build/outputs/apk/release/FeatherLightLauncher-v${{ steps.version.outputs.version_name }}.apk
